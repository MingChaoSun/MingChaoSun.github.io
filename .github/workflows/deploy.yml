name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with Astro
        run: npx astro build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      # notify Baidu of every deployed URL (quota ~10/day, so only push what exists)
      - name: Push sitemap URLs to Baidu
        continue-on-error: true # a Baidu hiccup must never block the Pages deploy
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          grep -o '<loc>[^<]*</loc>' dist/sitemap-0.xml | sed -e 's/<loc>//' -e 's|</loc>||' > urls.txt
          echo "URLs to push:"; cat urls.txt
          curl -s -m 30 -H 'Content-Type:text/plain' --data-binary @urls.txt \
            "http://data.zz.baidu.com/urls?site=https://mingchaosun.com&token=${BAIDU_TOKEN}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
